# Gitleaks config — extends default rules with xtrm-tools allowlists.
# Docs: https://github.com/gitleaks/gitleaks/blob/master/README.md#configuration

[extend]
useDefault = true

[allowlist]
description = "xtrm-tools allowlist"
# Historical Qwen OAuth credentials were revoked; keep this commit out of full-history scans.
commits = [
    '''dc019b8848a03ceedc3d388c9316110acb2c4b1d''',
    # 79ed7e61 mirrored Specialists KPI prose whose "token cost" wording trips the
    # generic-api-key rule on prose (no secret). Rewritten in 0477306b within the same
    # PR; gitleaks v8.30.1 still scans the intermediate commit in base..head and
    # full-history ranges, so the commit must be allowlisted explicitly.
    '''79ed7e61a503a656dba860f3c5f9801f29f9ca22''',
]
stopwords = []
regexes = [
    # Test fixture placeholders in cli/test/install-pi.test.ts.
    '''sk-existing-123''',
    '''zai-existing-456''',
]
paths = [
    # Local secrets (gitignored). Keep narrow: do not blanket-allowlist .env.*.
    '''^\.env$''',
    '''^\.env\.local$''',
    '''^\.env\.development\.local$''',
    '''^\.env\.test\.local$''',
    '''^\.env\.production\.local$''',
    '''^\.env\.example$''',

    # Local package/cache directories visited by no-git scans.
    '''^node_modules/.*''',
    '''^cli/node_modules/.*''',
    '''^\.pi/npm/.*''',
    '''^cli/\.pi/npm/.*''',

    # Beads issue tracker exports and Dolt storage contain commit hashes,
    # issue IDs, memory keys, and runtime state that trip generic rules.
    '''^\.beads/.*''',
    '''^\.dolt/.*''',
    '''^\.gitnexus/.*''',
    '''^\.serena/cache/.*''',

    # Board-audit gen-2 exports commit raw-beads.jsonl (structured beads data:
    # memory keys, issue titles, timestamps). Same finding class as .beads/.
    '''^\.xtrm/board-audit/exports/.*''',

    # Specialist runtime state and local DB caches.
    '''^\.specialists/db/.*''',
    '''^\.specialists/jobs/.*''',
    '''^\.specialists/ready/.*''',

    # XTRM runtime/generated state.
    '''^\.xtrm/statusline-claim$''',
    '''^\.xtrm/cache/.*''',
    '''^\.xtrm/logs/.*''',
    '''^\.xtrm/worktrees/.*''',
]
