[changelog]
header = ""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- **{{ commit.message | split(pat="\n") | first | trim | upper_first }}** ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/xtrm-dev/core/commit/{{ commit.id }})) — {{ commit.author.timestamp | date(format="%Y-%m-%d %H:%M", timezone="UTC") }}
{% endfor %}{% endfor %}
"""
trim = false
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# Merge commits (from actions/checkout on pull_request → refs/pull/N/merge)
# are skipped via a parser below — see the "^Merge " entry. This keeps CI's
# cliff output identical to local's.
# Generic type grouping. Add repo-specific SCOPE parsers above these — see the P0 bead.
commit_parsers = [
  # Merge commits (GH Actions synthesizes refs/pull/N/merge on pull_request events).
  # Skipping them keeps CI's cliff output identical to local's. See xtrm-reyem.13.
  { message = "^Merge ", skip = true },
  # Meta-commits that just refresh CHANGELOG.md don't belong IN the changelog —
  # otherwise every regen adds a new commit which requires another regen, forever.
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^(docs|chore|build|ci|test|refactor|style)", group = "Project maintenance" },
  { message = "^v?[0-9]+\\.[0-9]+\\.[0-9]+$", skip = true },
  { message = ".*", group = "Other changes" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v?[0-9].*"
