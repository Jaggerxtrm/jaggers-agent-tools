name: Semgrep

# SAST scanner. On PRs, semgrep ci compares against the merge-base and blocks
# new findings. Scheduled runs provide the broad historical scan without
# turning pre-existing debt into unrelated PR failures.

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC weekly

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Semgrep CI
        run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/default
            p/security-audit
            p/secrets
            p/python
            p/dockerfile
            p/github-actions
