name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '["self-hosted","linux","mercury-lite","xtrm-tools"]') }}

    strategy:
      matrix:
        node-version: [24.x]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Node dependencies
      run: npm ci && cd cli && npm ci

    - name: Finalize skills-v4 Core distribution
      if: github.event_name == 'pull_request' && github.head_ref == 'feat/skills-v4-system-consolidation'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        FROZEN_SPECIALISTS_SHA: f8cac893159959655d7787806704ce89d834d381
      run: |
        set -euo pipefail
        git fetch origin "$GITHUB_HEAD_REF" --depth=3
        git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"

        rm -rf "$RUNNER_TEMP/specialists-v4"
        git init "$RUNNER_TEMP/specialists-v4"
        git -C "$RUNNER_TEMP/specialists-v4" remote add origin https://github.com/xtrm-dev/specialists.git
        git -C "$RUNNER_TEMP/specialists-v4" fetch --depth=1 origin "$FROZEN_SPECIALISTS_SHA"
        git -C "$RUNNER_TEMP/specialists-v4" checkout --detach FETCH_HEAD
        test "$(git -C "$RUNNER_TEMP/specialists-v4" rev-parse HEAD)" = "$FROZEN_SPECIALISTS_SHA"

        node scripts/skills-v4-core-finalize.mjs
        SPECIALISTS_REPO_PATH="$RUNNER_TEMP/specialists-v4" npm run vendor:specialists

        # Build once so the canonical instruction-header injector is importable.
        npm run build
        node --input-type=module -e "const { injectProjectInstructionHeaders } = await import('./cli/dist/commands/init.js'); await injectProjectInstructionHeaders(process.cwd());"
        npm run gen-registry
        npm run build

        npm run check:skills-ownership
        npm run check:managed-skills
        npm run check:specialists-vendor
        npm run check:vendored-specialists-parity
        npm run check:registry-pack-parity
        npm run check:layout-guards
        npm run check:skill-root-budget

        # Restore the ordinary read-only workflow and remove one-shot machinery.
        git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
        rm scripts/skills-v4-core-finalize.mjs

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "fix(skills): finalize Core v4 distribution"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
        fi

    - name: Check package metadata
      run: npm run check:package

    - name: CHANGELOG.md [Unreleased] is an empty placeholder
      run: npm run changelog:check

    - name: Build contracts package
      run: npm run build:contracts

    - name: Build TypeScript
      run: cd cli && npm run build

    - name: Verify dist is up to date
      run: git diff --exit-code cli/dist/ || (echo "dist/ is out of sync — run 'cd cli && npm run build' and commit the result" && exit 1)

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff

    - name: Run Linting
      run: |
        npx eslint . --ignore-pattern "**/node_modules/**" || echo "Eslint not configured yet"
        ruff check . || echo "Ruff not configured yet"

    - name: Check skills ownership and managed skill contracts
      run: |
        npm run check:skills-ownership
        npm run check:managed-skills

    - name: Policy parity checks (Claude + Pi)
      env:
        PI_AGENT_DIR: ${{ runner.temp }}/pi-agent
      run: |
        mkdir -p "$PI_AGENT_DIR/extensions"
        cp -r packages/pi-extensions/extensions/* "$PI_AGENT_DIR/extensions/"
        node scripts/compile-policies.mjs --check
        node scripts/compile-policies.mjs --check-pi

    - name: Verify specialists vendor and package registry freshness
      run: |
        npm run check:skills-ownership
        npm run check:managed-skills
        npm run check:registry-pack-parity
        npm run check:specialists-vendor
        git diff --exit-code -- .xtrm/skills/default .xtrm/skills/optional .xtrm/specialists-source.json .xtrm/registry.json

    - name: Verify command deprecation ledger
      run: npm run check:deprecations

    - name: Verify Pi extension manifest schema
      run: npm run check:pi-manifest

    - name: Verify runtime-compatibility contract
      run: npm run check:runtime-compat

    - name: Flat active skills layout guard
      run: npm run check:layout-guards

    - name: Skill root budget guard
      run: npm run check:skill-root-budget

    - name: Forbidden-phrase drift guard
      run: npm run check:forbidden-phrases

    - name: Vendored Specialists skill parity guard
      run: npm run check:vendored-specialists-parity

    - name: Run Tests
      run: |
        npm test --prefix cli
        npm run test:scripts
