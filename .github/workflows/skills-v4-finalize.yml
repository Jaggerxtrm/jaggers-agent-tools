name: skills-v4 deterministic finalizer

on:
  push:
    branches: [ feat/skills-v4-system-consolidation ]
    paths:
      - '.github/workflows/skills-v4-finalize.yml'

permissions:
  contents: write

concurrency:
  group: skills-v4-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd cli && npm ci

      - name: Harden foreign hook-wrapper reconciliation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sourcePath = 'cli/src/core/claude-runtime-sync.ts';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const oldStable = `function stableHookHash(wrapper: HookWrapper): string {
              const canonical = {
                  matcher: wrapper.matcher ?? null,
                  hooks: wrapper.hooks.map((hook) => ({ type: hook.type, command: hook.command, timeout: hook.timeout ?? null })),
              };
              return crypto.createHash('sha256').update(JSON.stringify(canonical)).digest('hex');
          }`;
          const newStable = `function stableHookHash(wrapper: HookWrapper): string {
              const canonical = {
                  matcher: wrapper.matcher ?? null,
                  // Settings.json is an external/runtime boundary. Unknown third-party
                  // wrapper shapes must remain hashable without being mistaken for a
                  // valid generated wrapper or crashing reconciliation.
                  hooks: Array.isArray(wrapper.hooks)
                      ? wrapper.hooks.map((hook) => ({ type: hook.type, command: hook.command, timeout: hook.timeout ?? null }))
                      : null,
              };
              return crypto.createHash('sha256').update(JSON.stringify(canonical)).digest('hex');
          }`;
          if (!source.includes(oldStable)) throw new Error('stableHookHash anchor not found');
          source = source.replace(oldStable, newStable);

          const oldResolve = `function resolveHooksForRuntime(hooks: Record<string, HookWrapper[]>, hooksDir: string): Record<string, HookWrapper[]> {
              const rewrittenHooks: Record<string, HookWrapper[]> = {};
              for (const [eventName, wrappers] of Object.entries(hooks)) {
                  const wrapperList = Array.isArray(wrappers) ? wrappers : [wrappers as HookWrapper];
                  rewrittenHooks[eventName] = wrapperList.map((wrapper) => ({
                      ...wrapper,
                      hooks: wrapper.hooks.map((hook) => hook.type !== 'command'
                          ? hook
                          : { ...hook, command: rewritePluginRootCommandToProjectHookPath(hook.command, hooksDir) }),
                  }));
              }
              return rewrittenHooks;
          }`;
          const newResolve = `function resolveHooksForRuntime(hooks: Record<string, HookWrapper[]>, hooksDir: string): Record<string, HookWrapper[]> {
              const rewrittenHooks: Record<string, HookWrapper[]> = {};
              for (const [eventName, wrappers] of Object.entries(hooks)) {
                  const wrapperList = Array.isArray(wrappers) ? wrappers : [wrappers as HookWrapper];
                  rewrittenHooks[eventName] = wrapperList.map((wrapper) => {
                      // Preserve unrecognized third-party wrapper shapes verbatim. Only
                      // canonical command-hook arrays are ours to rewrite.
                      if (!Array.isArray(wrapper.hooks)) {
                          return wrapper;
                      }
                      return {
                          ...wrapper,
                          hooks: wrapper.hooks.map((hook) => hook.type !== 'command'
                              ? hook
                              : { ...hook, command: rewritePluginRootCommandToProjectHookPath(hook.command, hooksDir) }),
                      };
                  });
              }
              return rewrittenHooks;
          }`;
          if (!source.includes(oldResolve)) throw new Error('resolveHooksForRuntime anchor not found');
          source = source.replace(oldResolve, newResolve);
          fs.writeFileSync(sourcePath, source);

          const testPath = 'cli/src/tests/claude-runtime-sync-reconcile.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldImport = `import { mergeProjectOwnedHooks, reconcileProjectClaudeHooks } from '../core/claude-runtime-sync.js';`;
          const newImport = `import { mergeProjectOwnedHooks, reconcileProjectClaudeHooks, resolveHooksForGlobalRuntime } from '../core/claude-runtime-sync.js';`;
          if (!test.includes(oldImport)) throw new Error('reconcile test import anchor not found');
          test = test.replace(oldImport, newImport);

          const anchor = `  it('tolerates malformed hooks entries without crashing', () => {`;
          const regression = `  it('preserves third-party wrapper objects without hooks across resolution and merge', () => {
              const foreign = {
                matcher: 'Bash',
                provider: 'third-party',
              };
              const resolved = resolveHooksForGlobalRuntime(
                { PreToolUse: [foreign as never] },
                '/home/test/.xtrm/hooks',
              );
              expect(resolved.PreToolUse[0]).toEqual(foreign);

              const merged = mergeProjectOwnedHooks(
                { PreToolUse: [foreign as never] },
                canonical,
                '/repo/.xtrm/hooks',
              );
              expect(merged.PreToolUse).toContainEqual(foreign);
            });

`;
          if (!test.includes(anchor)) throw new Error('reconcile regression anchor not found');
          test = test.replace(anchor, regression + anchor);
          fs.writeFileSync(testPath, test);
          NODE

      - name: Pin frozen Specialists source
        env:
          SPECIALISTS_SHA: f8cac893159959655d7787806704ce89d834d381
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sha = process.env.SPECIALISTS_SHA;
          const updates = [
            ['.xtrm/specialists-source.json', (j) => { j.source.resolved_sha = sha; }],
            ['docs/skills-ownership.json', (j) => { j.mirrors.specialists.release.sha = sha; }],
            ['docs/skills-ownership.release.json', (j) => { j.mirrors.specialists.sha = sha; }],
          ];
          for (const [path, mutate] of updates) {
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            mutate(json);
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
          }
          NODE

      - name: Materialize frozen Specialists payload
        env:
          SPECIALISTS_SHA: f8cac893159959655d7787806704ce89d834d381
        run: |
          rm -rf ../specialists
          git clone --depth 1 --branch feat/skills-v4-runtime-doctrine https://github.com/xtrm-dev/specialists.git ../specialists
          test "$(git -C ../specialists rev-parse HEAD)" = "$SPECIALISTS_SHA"
          SPECIALISTS_REPO_PATH=../specialists node scripts/vendor-specialists-from-manifest.mjs
          test "$(node -p "require('./.xtrm/specialists-source.json').source.resolved_sha")" = "$SPECIALISTS_SHA"

      - name: Rebuild canonical project instruction headers
        run: |
          cd cli
          npx tsx -e "import { injectProjectInstructionHeaders } from './src/commands/init.ts'; (async () => { await injectProjectInstructionHeaders(process.env.GITHUB_WORKSPACE); })().catch((error) => { console.error(error); process.exit(1); });"

      - name: Regenerate registry and built payload
        run: |
          npm run gen-registry
          npm run build

      - name: Deterministic v4 guards
        run: |
          npm run check:skills-ownership
          npm run check:managed-skills
          npm run check:registry-pack-parity
          npm run check:specialists-vendor
          npm run check:layout-guards
          npm run check:gitnexus-no-counter
          npm run check:skills-symlinks
          npm run check:skill-root-budget
          npm run check:forbidden-phrases
          npm run check:vendored-specialists-parity
          node scripts/verify-asset-contract.mjs --contract ../specialists/dist/asset-contract.json
          npm run typecheck
          npm test --prefix cli
          npm run test:scripts

      - name: Commit durable generated state and remove finalizer
        env:
          BRANCH: feat/skills-v4-system-consolidation
        run: |
          rm -f .github/workflows/skills-v4-finalize.yml
          git config user.name 'xtrm-skills-v4-finalizer[bot]'
          git config user.email 'xtrm-skills-v4-finalizer[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No durable changes after regeneration.'
            exit 0
          fi
          git commit -m 'chore(skills-v4): finalize generated payload'
          git push origin "HEAD:$BRANCH"
