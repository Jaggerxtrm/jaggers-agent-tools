name: Service-Skills Orphan Scan

on:
  workflow_call:
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:

concurrency:
  group: service-skills-orphans-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      missing-count: ${{ steps.scan.outputs.missing_count }}
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout detector
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: xtrm-dev/core
          ref: main
          path: .xtrm-core
          sparse-checkout: .xtrm/skills/default/service-skills/scripts/service_skill_orphan_scan.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Detect unregistered compose services
        id: scan
        run: |
          set -e
          if [ ! -f docker-compose.yml ] || ! compgen -G '.xtrm/skills/*/service-skills/service-registry.json' >/dev/null; then
            echo '{"conceptual_ok": [], "missing": []}' > /tmp/service-skill-orphans.json
            echo 'missing_count=0' >> "$GITHUB_OUTPUT"
            echo '::notice::service-skills orphan scan skipped: compose file or registry not found'
            exit 0
          fi
          set +e
          python3 .xtrm-core/.xtrm/skills/default/service-skills/scripts/service_skill_orphan_scan.py \
            --root "$GITHUB_WORKSPACE" > /tmp/service-skill-orphans.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            cat /tmp/service-skill-orphans.json
            exit "$status"
          fi
          missing_count=$(python3 -c 'import json; print(len(json.load(open("/tmp/service-skill-orphans.json"))["missing"]))')
          echo "missing_count=$missing_count" >> "$GITHUB_OUTPUT"
          cat /tmp/service-skill-orphans.json
          {
            echo '## Service-skills orphan scan'
            echo
            echo "Missing compose services: **$missing_count**"
            echo
            echo '```json'
            cat /tmp/service-skill-orphans.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan result
        if: steps.scan.outputs.missing_count != '0'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: service-skills-orphans
          path: /tmp/service-skill-orphans.json
          if-no-files-found: error
          retention-days: 1

      - name: Report mutation gate closed
        if: steps.scan.outputs.missing_count != '0' && vars.ARCHON_ALLOW_SERVICE_SKILL_PR != '1'
        run: |
          echo '::notice::gate closed: ARCHON_ALLOW_SERVICE_SKILL_PR is not 1; checklist PR skipped'
          echo 'gate closed: checklist PR skipped' >> "$GITHUB_STEP_SUMMARY"

  open-pr:
    needs: scan
    if: needs.scan.outputs.missing-count != '0' && vars.ARCHON_ALLOW_SERVICE_SKILL_PR == '1'
    runs-on: ubuntu-latest
    environment: protected
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download scan result
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: service-skills-orphans
          path: /tmp/service-skills-orphans

      - name: Build orphan checklist
        run: |
          mkdir -p .xtrm
          python3 - <<'PY'
          import json
          from pathlib import Path

          missing = json.loads(Path('/tmp/service-skills-orphans/service-skill-orphans.json').read_text())['missing']
          lines = ['# Unregistered compose services', '', 'Register a complete service-skill for each service:', '']
          lines.extend(f'- [ ] `{name}`' for name in missing)
          lines += ['', 'Generated by the deterministic service-skills orphan scan.']
          body = '\n'.join(lines) + '\n'
          Path('.xtrm/service-skills-orphans.md').write_text(body)
          Path('/tmp/service-skills-orphan-pr.md').write_text(body)
          PY

      - name: Open checklist PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: xtrm-service-skills-orphans
          commit-message: 'chore(service-skills): flag unregistered compose services [skip ci]'
          title: 'chore(service-skills): register orphaned compose services'
          body-path: /tmp/service-skills-orphan-pr.md
          delete-branch: true
